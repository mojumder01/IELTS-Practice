name: Media

# Files uploaded to media-inbox/ on GitHub (docs/SETUP.md, step 9): converts them with
# npm run media, commits the result to main, then starts Deploy, which also updates the
# media list in Firestore. A push made with the workflow's token doesn't start Deploy by
# itself, so it's started by name.
on:
  push:
    branches: [main]
    paths: ['media-inbox/**']
  workflow_dispatch:

concurrency:
  group: media
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  media:
    name: Convert uploaded media
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Move uploads into public/media
        run: npx tsx scripts/media-inbox.ts
      - run: npm run media
      - run: npm run validate

      - name: Commit to main
        id: commit
        run: |
          git add -A media-inbox public/media content
          if git diff --cached --quiet; then
            echo "Nothing new in media-inbox/."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "media: add uploaded files" -m "$(git diff --cached --name-only --diff-filter=A -- public/media)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start Deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
